  <rect width="480" height="360" fill="transparent"/>
  <rect x="60" y="28" width="360" height="304" rx="16" fill="url(#paper)" filter="url(#sh)" stroke="#ead9c8" stroke-width="1"/>
  <rect x="200" y="52" width="80" height="80" rx="40" fill="#e8d5d0"/>
  <rect x="100" y="148" width="280" height="10" rx="3" fill="#c9a227" opacity="0.35"/>
  <rect x="100" y="170" width="260" height="8" rx="2" fill="#d6cfc7"/>
  <rect x="100" y="188" width="280" height="8" rx="2" fill="#e5ddd4"/>
  <rect x="100" y="206" width="240" height="8" rx="2" fill="#e5ddd4"/>
  <rect x="100" y="240" width="120" height="56" rx="8" fill="#f5ebe0" stroke="#ead9c8"/>
  <rect x="236" y="240" width="120" height="56" rx="8" fill="#f5ebe0" stroke="#ead9c8"/>
  <rect x="210" y="16" width="60" height="5" rx="2" fill="#c9a227"/>
